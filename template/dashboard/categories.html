{% extends 'base.html' %}

{% block content %}

<div class="row">
    <!-- left side bar -->
   <!-- load side bar here  -->
 {% include 'dashboard/sidebar.html' %}

    <!-- right side content  -->
     <div class="col-md-9">
        <h2>All categories</h2>
        <a href="{% url 'add_category'%}" class="btn btn-dark text-light float-right mb-2">Add New</a>
      <table class="table table-hover">
  <thead>
    <tr>
      <th >#</th>
      <th >Category Name</th>
      <th >Created at</th>
      <th >Updated at</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for cat in categories %}
    <tr>
      <th >{{forloop.counter}}</th>
      <td>{{ cat }}</td>
      <td>{{ cat.created_at }}</td>
      <td>{{ cat.updated_at }}</td>
      <td>
         <a href="{% url 'edit_category' cat.id %}"><i class="fas fa-edit text-success"></i></a>&nbsp;&nbsp;
         <a href="{% url 'delete_category' cat.id %}"><i class="fas fa-trash text-danger"></i></a>
      </td>
    </tr>
   {% endfor %}
  </tbody>
</table>
     </div>
</div>
{% endblock %}
