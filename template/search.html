{% extends 'base.html'%}

{%block content%}

<!-- featured_post -->
 <h3 class=" text-warning" style="letter-spacing: 2px;">Serach Term- {{keyword}}</h3>
  <div class="row mb-2">
    {%if blogs%}
    {% for i in blogs %}
  
    <div class="col-md-6">
      <div class="card border-0" >
        <div class="card-body">
          <h3><a href= "{%url 'blogs' i.slug %}" class="text-dark" >{{i.title}}</a></h3>
          <small class="mb-1 text-muted">{{i.created_at | timesince}} ago| {{i.author}}</small>
          <p class="card-text">{{i.short_description | truncatewords:25}}</p>
        </div>
      </div>
    </div>
  {%endfor%}
  {%else%}
  <p>No blogs found</p>
  </div>
  {%endif%}
<!-- recent posts  -->


</div>ś
{%endblock%}
